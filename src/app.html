<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="Add your wishlist and find out who you're getting a gift for." />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Secret Santa" />
		<meta property="og:title" content="AJ Rhabdo Secret Santa 2026" />

		<meta property="og:image:alt" content="A watercolor Christmas tree with presents underneath" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
